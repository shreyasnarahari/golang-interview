name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Format check
        run: make fmt

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Solution tests (with race detector)
        run: make race

      - name: Compile-check markdown code snippets
        run: make mdcheck
